<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Report a concern{% endblock %}</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; background:#f4f4f4; margin:0; color:#222; }
    .wrap { max-width:680px; margin:0 auto; padding:24px 16px; }
    .card { background:#fff; border:1px solid #ddd; border-radius:6px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; margin:0 0 4px; } .sub { color:#666; font-size:13px; margin-bottom:14px; }
    label { display:block; font-weight:bold; margin:12px 0 4px; font-size:13px; }
    input[type=text], select, textarea { width:100%; padding:8px; border:1px solid #bbb; border-radius:4px; font:inherit; box-sizing:border-box; }
    button, .btn { background:#b8860b; color:#fff; border:0; padding:10px 18px; border-radius:4px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
    .err { background:#fdecea; border:1px solid #f5c2c0; color:#8a1f17; padding:10px; border-radius:4px; margin-bottom:12px; }
    .ok { background:#e8f5e9; border:1px solid #b7dfb9; padding:10px; border-radius:4px; }
    .key { font-family:monospace; font-size:18px; background:#fffbe6; border:1px dashed #b8860b; padding:8px 12px; display:inline-block; margin:4px 0; user-select:all; }
    .muted { color:#666; font-size:12.5px; }
    .hp { position:absolute; left:-9999px; }
    .msg { border-left:4px solid #999; padding:4px 10px; margin:8px 0; white-space:pre-wrap; }
    .msg.staff { border-color:#2e7d32; } .msg.you { border-color:#b8860b; }
  </style>
</head>
<body>
<div class="wrap">
  {% block body %}{% endblock %}
  <p class="muted" style="text-align:center;">Confidential reporting service operated by Neverlank Chartered Accountants on behalf of {{ client_name }}. We do not record your name, IP address or device details.</p>
</div>
</body>
</html>
