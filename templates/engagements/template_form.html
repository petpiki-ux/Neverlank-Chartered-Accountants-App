{% extends "base.html" %}
{% block title %}New Template - {{ firm_name }}{% endblock %}
{% block content %}
<div class="page-header"><h1>New Checklist Template</h1></div>
<div class="card" style="max-width:560px;">
  <form method="post">
    <label for="name">Template name *</label>
    <input type="text" id="name" name="name" placeholder="e.g. Standard Statutory Audit Program" required>
    <label for="type">Engagement type</label>
    <select id="type" name="type">
      {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
    </select>
    <label for="description">Description</label>
    <textarea id="description" name="description"></textarea>
    <button type="submit" class="btn gold">Create template</button>
    <a href="{{ url_for('engagements.list_templates') }}" class="btn secondary">Cancel</a>
  </form>
</div>
{% endblock %}
