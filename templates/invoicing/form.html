{% extends "base.html" %}
{% block title %}New Invoice - {{ firm_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Invoice</h1>
</div>
<div class="card" style="max-width:640px;">
  <form method="post">
    <div class="form-row">
      <div>
        <label for="client_id">Client *</label>
        <select id="client_id" name="client_id" required onchange="filterEngagements()">
          <option value="">Select client...</option>
          {% for c in clients %}
          <option value="{{ c.id }}" {% if preselect_client_id==c.id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="engagement_id">Engagement (optional)</label>
        <select id="engagement_id" name="engagement_id">
          <option value="">None - not tied to a specific engagement</option>
          {% for e in engagements %}
          <option value="{{ e.id }}" data-client="{{ e.client_id }}" {% if preselect_engagement_id==e.id %}selected{% endif %}>{{ e.title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <script>
      function filterEngagements() {
        var clientId = document.getElementById('client_id').value;
        var select = document.getElementById('engagement_id');
        for (var i = 0; i < select.options.length; i++) {
          var opt = select.options[i];
          if (!opt.value) { opt.hidden = false; continue; }
          var matches = (opt.getAttribute('data-client') === clientId);
          opt.hidden = !matches;
          if (!matches && opt.selected) { select.value = ''; }
        }
      }
      filterEngagements();
    </script>

    <div class="form-row">
      <div>
        <label for="currency">Currency</label>
        <select id="currency" name="currency">
          {% for c in currencies %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="vat_pct">VAT %</label>
        <input type="number" step="0.1" min="0" id="vat_pct" name="vat_pct" value="15.0">
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="issue_date">Issue date</label>
        <input type="date" id="issue_date" name="issue_date" value="{{ today }}">
      </div>
      <div>
        <label for="due_date">Due date</label>
        <input type="date" id="due_date" name="due_date">
      </div>
    </div>

    <label for="bill_to">Bill to (name / address - defaults to the client's name)</label>
    <textarea id="bill_to" name="bill_to" rows="3"></textarea>

    <label for="notes">Notes (payment instructions, bank details, etc.)</label>
    <textarea id="notes" name="notes" rows="3"></textarea>

    <button type="submit" class="btn gold">Create invoice</button>
    <a href="{{ url_for('invoicing.list_invoices') }}" class="btn secondary">Cancel</a>
  </form>
</div>
{% endblock %}
