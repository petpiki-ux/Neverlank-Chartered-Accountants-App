{% extends "base.html" %}
{% block title %}Edit {{ quotation.quote_number }} - {{ firm_name }}{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit {{ quotation.quote_number }}</h1></div>
<div class="card" style="max-width:700px;">
  <form method="post">
    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" value="{{ quotation.subject or '' }}">
    <div class="form-row">
      <div>
        <label for="currency">Currency</label>
        <select id="currency" name="currency">{% for c in currencies %}<option value="{{ c }}" {% if quotation.currency==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
      </div>
      <div><label for="vat_pct">VAT %</label><input type="number" step="0.1" min="0" id="vat_pct" name="vat_pct" value="{{ quotation.vat_pct }}"></div>
      <div><label for="issue_date">Date</label><input type="date" id="issue_date" name="issue_date" value="{{ quotation.issue_date.isoformat() if quotation.issue_date else '' }}"></div>
      <div><label for="valid_until">Valid until</label><input type="date" id="valid_until" name="valid_until" value="{{ quotation.valid_until.isoformat() if quotation.valid_until else '' }}"></div>
    </div>
    <label for="bill_to">Prepared for</label>
    <textarea id="bill_to" name="bill_to" rows="3">{{ quotation.bill_to or '' }}</textarea>
    <label for="notes">Introduction / scope</label>
    <textarea id="notes" name="notes" rows="3">{{ quotation.notes or '' }}</textarea>
    <label for="terms">Terms &amp; conditions</label>
    <textarea id="terms" name="terms" rows="7">{{ quotation.terms or '' }}</textarea>
    <button type="submit" class="btn gold">Save changes</button>
    <a href="{{ url_for('quotations.view_quotation', quotation_id=quotation.id) }}" class="btn secondary">Cancel</a>
  </form>
</div>
{% endblock %}
