{% extends "base.html" %}
{% block title %}My Account - {{ firm_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>My Account</h1>
    <div class="subtitle">Username: {{ current_user.username }} &middot; Role: {{ current_user.role }}</div>
  </div>
</div>
<div class="card" style="max-width:480px;">
  <form method="post">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" value="{{ current_user.name }}" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ current_user.email or '' }}">
    <label for="new_password">New password (leave blank to keep current)</label>
    <input type="password" id="new_password" name="new_password">
    <button type="submit" class="btn gold">Save changes</button>
  </form>
</div>
{% endblock %}
