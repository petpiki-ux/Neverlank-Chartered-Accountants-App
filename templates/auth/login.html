<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - {{ firm_name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/neverlank-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="{{ url_for('static', filename='img/neverlank-logo.png') }}" alt="Neverlank" class="login-logo">
        <h1>Neverlank</h1>
        <div class="tag">Audit, Assurance &amp; Consulting workspace</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-list">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn gold" style="width:100%;">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
