services:
  - type: web
    name: neverlank-audit-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 120
    healthCheckPath: /auth/login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.11.9
      # Sending invoices and reminders by email (see emailer.py). Create a free
      # Resend (or Brevo) account, verify neverlank.co.zw there, then enter these
      # three values in Render > Environment.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # The address clients use; used for the invoice links sent on WhatsApp.
      - key: PUBLIC_BASE_URL
        value: https://neverlank-audit-app.onrender.com
    disk:
      name: neverlank-data
      mountPath: /var/data
      sizeGB: 1
